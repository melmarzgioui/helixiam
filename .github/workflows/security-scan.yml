name: Security scan

# Trivy scans the checked-out source for known-vulnerable dependencies (Maven/npm/Go lockfiles) and for
# misconfigurations (Dockerfiles, Helm, compose). Results upload to GitHub code scanning as SARIF.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC — surface newly-disclosed CVEs against the default branch

permissions:
  contents: read

jobs:
  trivy-fs:
    name: dependency + config scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan (vulns + misconfig + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # Cache the vulnerability DB in the runner-local cache to avoid rate-limited pulls.
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
