name: Release

# On a version tag: build and push the server image to GHCR, generate an SBOM, sign the image and
# attest the SBOM with cosign (keyless, via the workflow's OIDC identity — no long-lived keys), and
# publish a GitHub release with the SBOM attached. This is what SECURITY.md promises; it is real here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build, sign, release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/helix-iam-server" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # One multi-arch image (manifest list) for x86-64 and ARM64 servers under the same tag.
      - name: Build and push image for linux/amd64 + linux/arm64 (capture digest)
        id: build
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -t "${{ steps.img.outputs.image }}:${VERSION}" \
            -t "${{ steps.img.outputs.image }}:latest" \
            --metadata-file metadata.json \
            -f helix-iam-server/Dockerfile helix-iam-server
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "ref=${{ steps.img.outputs.image }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        # --recursive signs the manifest list and each per-architecture image.
        run: cosign sign --yes --recursive "${{ steps.build.outputs.ref }}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.build.outputs.ref }}
          format: spdx-json
          output-file: helix-iam-server.sbom.spdx.json

      - name: Attest the SBOM to the image (keyless)
        run: cosign attest --yes --type spdxjson --predicate helix-iam-server.sbom.spdx.json "${{ steps.build.outputs.ref }}"

      - name: Create GitHub release with the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            helix-iam-server.sbom.spdx.json \
            --title "${VERSION}" \
            --generate-notes \
            --notes "Container image: \`${{ steps.build.outputs.ref }}\` (linux/amd64 + linux/arm64; cosign-signed; SBOM attested and attached)."
