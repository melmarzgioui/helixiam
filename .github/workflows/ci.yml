name: CI

# Build + test every component on push to master and on PRs. Actions are pinned to a full commit SHA
# (the version tag is in the trailing comment) and kept current by Dependabot's github-actions ecosystem.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: helix-iam-server (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker daemon already running on the Actions ubuntu-latest
      # runner, so no docker-compose/service step is needed for PostgreSQL. The test suite runs
      # with spring.session.store-type=none, so no Redis service is needed either.
      - name: Build and test
        working-directory: helix-iam-server
        run: mvn -B -ntp clean verify

  dashboard:
    name: helix-dashboard (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: helix-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: helix-dashboard
        run: npm ci

      - name: Test
        working-directory: helix-dashboard
        run: npm test

      - name: Build
        working-directory: helix-dashboard
        run: npm run build

  terraform-provider:
    name: terraform-provider-helix (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-helix/go.mod
          cache-dependency-path: terraform-provider-helix/go.sum

      - name: Vet and test
        working-directory: terraform-provider-helix
        run: |
          go vet ./...
          go test ./...
