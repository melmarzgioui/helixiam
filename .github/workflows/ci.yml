name: CI

# Build + test every component on push to master and on PRs. Actions are pinned to a full commit SHA
# (the version tag is in the trailing comment) and kept current by Dependabot's github-actions ecosystem.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: helix-iam-server (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The real-browser e2e tests (io.helixiam.e2e.browser) drive Playwright's Chromium, which Playwright
      # downloads to ~/.cache/ms-playwright. Cache it per Playwright version (pinned in pom.xml), then install
      # the browser (a no-op on a cache hit) and the OS libraries it needs on this runner.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helix-iam-server/pom.xml') }}

      - name: Install Chromium for the browser tests
        working-directory: helix-iam-server
        run: >-
          mvn -B -ntp -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"

      # Testcontainers uses the Docker daemon already running on the Actions ubuntu-latest
      # runner, so no docker-compose/service step is needed for PostgreSQL or Redis. The browser
      # tests run in the same `mvn verify`, against the same embedded server.
      - name: Build and test
        working-directory: helix-iam-server
        run: mvn -B -ntp clean verify

      - name: Upload browser-test failure captures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: helix-iam-server/target/browser-failures/
          if-no-files-found: ignore

  dashboard:
    name: helix-dashboard (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: helix-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: helix-dashboard
        run: npm ci

      - name: Test
        working-directory: helix-dashboard
        run: npm test

      - name: Build
        working-directory: helix-dashboard
        run: npm run build

  terraform-provider:
    name: terraform-provider-helix (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-helix/go.mod
          cache-dependency-path: terraform-provider-helix/go.sum

      - name: Vet and test
        working-directory: terraform-provider-helix
        run: |
          go vet ./...
          go test ./...

  server-image:
    name: helix-iam-server image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same build as the release, without pushing: an image that no longer builds for either
      # architecture fails here instead of at release time.
      - name: Build for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f helix-iam-server/Dockerfile helix-iam-server

  server-image-boot:
    name: helix-iam-server image boots (${{ matrix.arch }})
    # Native build + boot on each architecture (no QEMU): the arm64 runner is a real arm64 machine, so this proves
    # the linux/arm64 image starts and passes readiness, not just that it builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the image, starts it with the Helm chart's default env and security context against an empty
      # PostgreSQL + Redis (containers on a private Docker network), waits for /actuator/health/readiness = UP.
      - name: Build and boot the image
        run: e2e/image-boot-smoke.sh
