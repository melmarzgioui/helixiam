apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helixiam.fullname" . }}
  labels: {{- include "helixiam.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.service.port | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_RO_HOST: {{ default .Values.database.host .Values.database.readHost | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  {{- if .Values.redis.host }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  {{- end }}
  IDP_BASE_URL: {{ .Values.config.idpBaseUrl | quote }}
  SP_BASE_URL: {{ .Values.config.spBaseUrl | quote }}
  HELIX_SAML_IDP_ENTITY_ID: {{ default (printf "%s/realms/master" .Values.config.idpBaseUrl) .Values.config.samlIdpEntityId | quote }}
  HELIX_SAML_IDP_ENABLED: {{ .Values.config.samlIdpEnabled | quote }}
  HELIX_SESSION_STORE: {{ .Values.config.sessionStore | default "redis" | quote }}
  HELIX_TOKEN_STORE: {{ .Values.config.tokenStore | default "queue" | quote }}
  USER_REGISTRATION_ENABLED: {{ .Values.config.registrationEnabled | quote }}
  HELIX_ACTUATOR_PROMETHEUS_ANONYMOUS: {{ .Values.config.prometheusAnonymous | quote }}
  HELIX_COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  HELIX_MIGRATIONS_ENABLED: {{ .Values.config.migrationsEnabled | quote }}
  HELIX_SQL_INIT_MODE: {{ ternary "never" "always" .Values.config.migrationsEnabled | quote }}
  HELIX_ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  MFA_ENABLED: {{ .Values.config.mfaEnabled | quote }}
  {{- with .Values.config.egressAllowedPrivateHosts }}
  HELIX_EGRESS_ALLOWED_PRIVATE_HOSTS: {{ join "," . | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapClientId }}
  HELIX_BOOTSTRAP_CLIENT_ID: {{ .Values.secrets.bootstrapClientId | quote }}
  HELIX_BOOTSTRAP_CLIENT_SECRET_FILE: "/etc/helixiam/bootstrap/client-secret"
  {{- end }}
  {{- if .Values.themes.enabled }}
  HELIX_THEME_DIRECTORY: {{ .Values.themes.mountPath | quote }}
  HELIX_THEME_RELOAD_INTERVAL_SECONDS: {{ .Values.themes.reloadIntervalSeconds | quote }}
  {{- end }}
  {{- with .Values.email }}
  {{- if .driver }}
  HELIX_NOTIFICATION_EMAIL_DRIVER: {{ .driver | quote }}
  {{- end }}
  {{- if .fromAddress }}
  HELIX_NOTIFICATION_EMAIL_FROM_ADDRESS: {{ .fromAddress | quote }}
  {{- end }}
  {{- if .fromName }}
  HELIX_NOTIFICATION_EMAIL_FROM_NAME: {{ .fromName | quote }}
  {{- end }}
  {{- if .smtp.host }}
  HELIX_NOTIFICATION_SMTP_HOST: {{ .smtp.host | quote }}
  {{- end }}
  {{- if .smtp.port }}
  HELIX_NOTIFICATION_SMTP_PORT: {{ .smtp.port | quote }}
  {{- end }}
  {{- if .smtp.username }}
  HELIX_NOTIFICATION_SMTP_USERNAME: {{ .smtp.username | quote }}
  {{- end }}
  {{- if .smtp.tlsMode }}
  HELIX_NOTIFICATION_SMTP_TLS_MODE: {{ .smtp.tlsMode | quote }}
  {{- end }}
  {{- if .smtp.passwordKey }}
  HELIX_NOTIFICATION_SMTP_PASSWORD_FILE: "/etc/helixiam/email/smtp-password"
  {{- end }}
  {{- if .cloudflare.accountId }}
  HELIX_NOTIFICATION_CLOUDFLARE_ACCOUNT_ID: {{ .cloudflare.accountId | quote }}
  {{- end }}
  {{- if .cloudflare.baseUrl }}
  HELIX_NOTIFICATION_CLOUDFLARE_BASE_URL: {{ .cloudflare.baseUrl | quote }}
  {{- end }}
  {{- if .cloudflare.apiTokenKey }}
  HELIX_NOTIFICATION_CLOUDFLARE_API_TOKEN_FILE: "/etc/helixiam/email/cloudflare-api-token"
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.enabled)) (ne (toString .retry.enabled) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_ENABLED: {{ .retry.enabled | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.delays)) (ne (toString .retry.delays) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_DELAYS: {{ .retry.delays | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.maxAge)) (ne (toString .retry.maxAge) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_MAX_AGE: {{ .retry.maxAge | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.jitter)) (ne (toString .retry.jitter) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_JITTER: {{ .retry.jitter | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.pollInterval)) (ne (toString .retry.pollInterval) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_POLL_INTERVAL: {{ .retry.pollInterval | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.batchSize)) (ne (toString .retry.batchSize) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_BATCH_SIZE: {{ .retry.batchSize | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .retry.lease)) (ne (toString .retry.lease) "") }}
  HELIX_NOTIFICATION_EMAIL_RETRY_LEASE: {{ .retry.lease | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .rateLimit.realmPerMinute)) (ne (toString .rateLimit.realmPerMinute) "") }}
  HELIX_NOTIFICATION_EMAIL_RATE_LIMIT_REALM_PER_MINUTE: {{ .rateLimit.realmPerMinute | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .rateLimit.globalPerMinute)) (ne (toString .rateLimit.globalPerMinute) "") }}
  HELIX_NOTIFICATION_EMAIL_RATE_LIMIT_GLOBAL_PER_MINUTE: {{ .rateLimit.globalPerMinute | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .codes.resetPasswordTtl)) (ne (toString .codes.resetPasswordTtl) "") }}
  HELIX_NOTIFICATION_RESET_PASSWORD_CODE_TTL: {{ .codes.resetPasswordTtl | toString | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .codes.signupTtl)) (ne (toString .codes.signupTtl) "") }}
  HELIX_NOTIFICATION_SIGNUP_CODE_TTL: {{ .codes.signupTtl | toString | quote }}
  {{- end }}
  {{- end }}
