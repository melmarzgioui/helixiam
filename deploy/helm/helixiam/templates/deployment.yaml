{{- include "helixiam.require" (dict "name" "config.idpBaseUrl" "val" .Values.config.idpBaseUrl) -}}
{{- include "helixiam.require" (dict "name" "config.spBaseUrl" "val" .Values.config.spBaseUrl) -}}
{{- include "helixiam.require" (dict "name" "database.host" "val" .Values.database.host) -}}
{{- if and (include "helixiam.redisRequired" .) (not .Values.redis.host) }}
{{- fail "helixiam: redis.host is required when config.sessionStore or config.tokenStore is redis (set both to queue to run without Redis)" -}}
{{- end }}
{{- include "helixiam.require" (dict "name" "secrets.existingSecret" "val" .Values.secrets.existingSecret) -}}
{{- if .Values.themes.enabled }}
{{- include "helixiam.require" (dict "name" "themes.configMap.name or themes.existingVolume" "val" (or .Values.themes.configMap.name .Values.themes.existingVolume)) -}}
{{- end }}
{{- if eq (lower (default "" .Values.email.driver)) "cloudflare" }}
{{- include "helixiam.require" (dict "name" "email.cloudflare.accountId" "val" .Values.email.cloudflare.accountId) -}}
{{- include "helixiam.require" (dict "name" "email.cloudflare.apiTokenKey" "val" .Values.email.cloudflare.apiTokenKey) -}}
{{- end }}
{{- $emailSecrets := or .Values.email.smtp.passwordKey .Values.email.cloudflare.apiTokenKey }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helixiam.fullname" . }}
  labels: {{- include "helixiam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "helixiam.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "helixiam.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "helixiam.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "helixiam.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "helixiam.fullname" . }}
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.dbUsernameKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.dbPasswordKey }}
            - name: DB_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.dbEncryptionKey }}
            {{- if .Values.secrets.adminPasswordKey }}
            - name: HELIX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.adminPasswordKey }}
                  optional: true
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.bootstrapClientId }}
            - name: bootstrap-client-secret
              mountPath: /etc/helixiam/bootstrap
              readOnly: true
            {{- end }}
            {{- if .Values.themes.enabled }}
            - name: themes
              mountPath: {{ .Values.themes.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $emailSecrets }}
            - name: email-secrets
              mountPath: /etc/helixiam/email
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.bootstrapClientId }}
        # The bootstrap service account's secret, as a file (HELIX_BOOTSTRAP_CLIENT_SECRET_FILE), never an env var.
        - name: bootstrap-client-secret
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440   # readable by the pod's fsGroup (10001), not world
            items:
              - key: {{ .Values.secrets.bootstrapClientSecretKey }}
                path: client-secret
        {{- end }}
        {{- if $emailSecrets }}
        # Email credentials as files (read at every send, so a rotated Secret applies without a restart).
        - name: email-secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440   # readable by the pod's fsGroup (10001), not world
            items:
              {{- if .Values.email.smtp.passwordKey }}
              - key: {{ .Values.email.smtp.passwordKey }}
                path: smtp-password
              {{- end }}
              {{- if .Values.email.cloudflare.apiTokenKey }}
              - key: {{ .Values.email.cloudflare.apiTokenKey }}
                path: cloudflare-api-token
              {{- end }}
        {{- end }}
        {{- if .Values.themes.enabled }}
        - name: themes
          {{- if .Values.themes.configMap.name }}
          configMap:
            name: {{ .Values.themes.configMap.name }}
            {{- with .Values.themes.configMap.items }}
            items: {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else }}
          {{- toYaml .Values.themes.existingVolume | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
