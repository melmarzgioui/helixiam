{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helixiam.fullname" . }}
  labels: {{- include "helixiam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "helixiam.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowSameNamespaceIngress }}
        - podSelector: {}
        {{- end }}
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector: {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.prometheusNamespaceSelector }}
        - namespaceSelector: {{- toYaml .Values.networkPolicy.prometheusNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL + Redis
    - ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
        - port: {{ .Values.redis.port }}
          protocol: TCP
    # TLS egress (federation JWKS, webhooks, outbound HTTPS)
    - ports:
        - port: 443
          protocol: TCP
        {{- range .Values.networkPolicy.extraEgressPorts }}
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
  {{- end }}
{{- end }}
