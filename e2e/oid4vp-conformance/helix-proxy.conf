# TLS termination for HelixIAM in a conformance run (stack.sh proxy fills in the placeholders).
# HelixIAM trusts this proxy's X-Forwarded-* headers because it connects from a peer listed in HELIX_TRUSTED_PROXIES.
server {
  listen __TLS_PORT__ ssl;
  server_name __HOST__;
  ssl_certificate /etc/nginx/tls/tls-fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  client_max_body_size 1m;
  location / {
    proxy_pass http://host.docker.internal:__HELIX_PORT__;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port __TLS_PORT__;
  }
}
