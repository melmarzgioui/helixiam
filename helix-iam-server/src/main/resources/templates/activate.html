<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Activate device', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title">Activate device</h1>
            <p class="hx-lead">Enter the code shown on your device or command line to authorise it on your account.</p>
        </div>

        <div class="container">
            <article>
                <form th:action="@{/oauth2/device_verification}" method="post" role="form">
                    <label for="user_code">Device code</label>
                    <input type="text" id="user_code" name="user_code" th:value="${userCode}"
                           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
                           placeholder="WDJB-MJHT"/>

                    <!--/* CSRF token when the chain enforces it; harmless when it doesn't. */-->
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="buttonHolder">
                        <button type="submit">
                            <span>Approve device</span>
                        </button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
