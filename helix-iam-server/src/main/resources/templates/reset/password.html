<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#a3d4c4">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2f3033">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
    <title th:text="#{reset.page.title}">KubeDNA - Password reset</title>
    <script defer src="/js/App.js?@project.version@" type="module"></script>
    <meta name="googlebot" content="noindex">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif" sizes="32x32">
    <link rel="icon" href="/img/favicon.avif" sizes="192x192">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar">
            <a>
                <div class="logo"><img src="/img/kubedna-zw.png" alt="KubeDNA"></div>
            </a>
        </div>
    </header>

    <main>
        <div class="container title">
            <h3 th:text="#{reset.title}">Password Reset</h3>
        </div>

        <div class="container">
            <article>
            <form th:action="@{/reset/password}" method="post" role="form" id="passwordReset" th:classappend="${errors != null ? 'invalid' : ''}">
                <label for="username" th:text="#{reset.username.label}">Email Address</label>
                <input type="text" th:classappend="${param.error != null ? 'invalid' : 'valid'}" id="username" name="username"/>
                <span class="error" th:text="#{reset.username.error}">Oops! It seems your email address slipped through the cracks. Could you send it our way again?</span>
                <!-- Auth-hardening (feature 5): CAPTCHA widget (renders only when the realm enables it). -->
                <div th:replace="~{fragments/captcha :: widget}"></div>
                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <button type="button" class="cancel" th:text="#{common.cancel}">Cancel</button>
                    <button type="submit">
                        <i class="email"></i>
                        <span th:text="#{reset.submit}">Reset Password</span>
                    </button>
                </div>
            </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
</body>
</html>
