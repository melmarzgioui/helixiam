<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{reset.title}, false)}"></th:block>
    <script defer src="/js/App.js" type="module"></script>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{reset.title}">Password Reset</h1>
        </div>

        <div class="container">
            <article>
            <form th:action="@{/reset/password}" method="post" role="form" id="passwordReset" th:classappend="${errors != null ? 'invalid' : ''}">
                <label for="username" th:text="#{reset.username.label}">Email Address</label>
                <input type="email" th:classappend="${errors != null ? 'invalid' : 'valid'}" id="username" name="username" autocomplete="email" th:attr="aria-invalid=${errors != null} ? 'true' : null, aria-describedby=${errors != null} ? 'username-error' : null"/>
                <span class="error" id="username-error" role="alert" th:if="${errors != null}" th:text="#{reset.username.error}">Oops! It seems your email address slipped through the cracks. Could you send it our way again?</span>
                <!--/* Auth-hardening (feature 5): CAPTCHA widget (renders only when the realm enables it). */-->
                <div th:replace="~{fragments/captcha :: widget}"></div>
                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <button type="button" class="cancel" th:attr="data-href=@{/login}" th:text="#{common.cancel}">Cancel</button>
                    <button type="submit">
                        <i class="email"></i>
                        <span th:text="#{reset.submit}">Reset Password</span>
                    </button>
                </div>
            </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
