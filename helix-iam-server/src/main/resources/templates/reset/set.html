<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{reset.set.title}, false)}"></th:block>
    <script defer th:src="@{/js/App.js}" type="module"></script>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{reset.set.title}">Password reset</h1>
        </div>

<!--/*        <div th:if="${errors.size() > 0}" class="container no-border">*/-->
<!--/*            <div class="actionError" id="loginFailed">*/-->
<!--/*                <i class="error"></i>*/-->
<!--/*                <span>Invalid information provided</span>*/-->
<!--/*            </div>*/-->
<!--/*        </div>*/-->

        <div class="container">
            <article>
                <div class="hx-alert hx-alert-error" id="password-error" role="alert" th:if="${errors.get('invalid.password') != null}" th:text="#{register.error.password}">The passwords are empty or do not match.</div>
                <div class="hx-alert hx-alert-error" role="alert" th:if="${errors.get('invalid.request') != null}" th:text="#{reset.set.error.failed}">The password could not be saved.</div>
                <form th:action="@{/reset/password/set}" th:object="${changePassword}" method="post" role="form" id="passwordReset"  th:classappend="${errors.get('invalid.password') != null ? 'invalid' : 'valid'}">

                    <label for="password" th:text="#{reset.set.password.label}">Password</label>
                    <input type="password" id="password" name="newPassword" th:field="*{newPassword}" th:classappend="${errors.get('invalid.password') != null ? 'invalid' : 'valid'}" autocomplete="new-password" th:attr="aria-invalid=${errors.get('invalid.password') != null} ? 'true' : null, aria-describedby=${errors.get('invalid.password') != null} ? 'password-error' : null"/>
                    <input type="hidden" name="code" th:field="*{code}"/>

                    <label for="repeatPassword" th:text="#{reset.set.repeatPassword.label}">Repeat Password</label>
                    <input type="password" id="repeatPassword" name="repeatPassword" th:field="*{repeatPassword}" th:classappend="${errors.get('invalid.password') != null ? 'invalid' : 'valid'}" autocomplete="new-password" th:attr="aria-invalid=${errors.get('invalid.password') != null} ? 'true' : null, aria-describedby=${errors.get('invalid.password') != null} ? 'password-error' : null"/>

                    <div class="spacer">&nbsp;</div>

                    <div class="buttonHolder">
                        <button type="button" class="cancel" th:attr="data-href=@{/login}" th:text="#{common.back}">Back</button>
                        <button type="submit">
                            <i class="login"></i>
                            <span th:text="#{reset.set.submit}">Update</span>
                        </button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
