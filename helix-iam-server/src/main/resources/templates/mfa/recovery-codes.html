<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#a3d4c4">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2f3033">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
    <title th:text="#{login.page.title}">HelixIAM - Login</title>
    <script defer src="/js/App.js?@project.version@" type="module"></script>
    <meta name="googlebot" content="noindex">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif" sizes="32x32">
    <link rel="icon" href="/img/favicon.avif" sizes="192x192">
    <link rel="icon" href="/img/favicon.avif">
    <!-- 1.0 item 7: the organization's (else the realm's) primary colour; validated #RRGGBB, never raw CSS. -->
    <style th:if="${brandingPrimaryColor != null}" th:inline="text">
        .buttonHolder > button, .buttonHolder > a.button { background-color: [[${brandingPrimaryColor}]] !important; border-color: [[${brandingPrimaryColor}]] !important; }
        .mainWrapper > main > div.container.title h3, details.recovery > summary { color: [[${brandingPrimaryColor}]] !important; }
    </style>
</head>
<body>
<div class="mainWrapper">

    <header>
        <div class="headerBar">
            <a>
                <div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div><span class="hx-org-name" th:if="${brandingOrgName != null}" th:text="${brandingOrgName}">Organization</span>
            </a>
        </div>
    </header>

    <main>
        <div class="container title">
            <h3 th:text="#{mfa.recovery.title}">Save your recovery codes</h3>
            <div class="description" th:text="#{mfa.recovery.description}">If you lose your authenticator app, each of these codes lets you sign in once. Store them somewhere safe; they are shown only now.</div>
        </div>

        <div class="container">
            <article>
                <ul class="recoveryCodes">
                    <li th:each="c : ${recoveryCodes}"><code th:text="${c}">ABCD-2345</code></li>
                </ul>
                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <a class="button" th:href="${continueUrl}" th:text="#{mfa.recovery.continue}">I saved them, continue</a>
                </div>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
</body>
</html>
