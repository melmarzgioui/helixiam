<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Register a passkey', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title">Register a Passkey</h1>
            <div class="description">Create a passkey for faster, phishing-resistant sign-in.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${registered}" class="hx-alert hx-alert-success" role="status">Passkey registered successfully.</div>
                <div th:if="${error}" class="hx-alert hx-alert-error" role="alert">Registration failed, please try again.</div>
                <form id="regForm" th:action="@{/webauthn/register}" method="post"
                      th:data-challenge="${challenge}" th:data-rp-id="${rpId}"
                      th:data-user-id="${userId}" th:data-username="${username}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" id="attestationObject" name="attestationObject"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <div class="buttonHolder"><button type="button" id="regBtn"><span>Create Passkey</span></button></div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
<!--/* Security review M3 (CSP): ceremony JS externalised to /js/webauthn-register.js (script-src 'self'). */-->
<script defer th:src="@{/js/webauthn-register.js}"></script>
</body>
</html>
