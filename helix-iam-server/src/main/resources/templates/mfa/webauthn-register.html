<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HelixIAM - Register Passkey</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Register a Passkey</h3>
            <div class="description">Create a passkey for faster, phishing-resistant sign-in.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${registered}" class="valid"><p>Passkey registered successfully.</p></div>
                <div th:if="${error}" class="error" style="display:block">Registration failed, please try again.</div>
                <form id="regForm" th:action="@{/webauthn/register}" method="post"
                      th:data-challenge="${challenge}" th:data-rp-id="${rpId}"
                      th:data-user-id="${userId}" th:data-username="${username}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" id="attestationObject" name="attestationObject"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <div class="buttonHolder"><button type="button" id="regBtn"><span>Create Passkey</span></button></div>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<!-- Security review M3 (CSP): ceremony JS externalised to /js/webauthn-register.js (script-src 'self'). -->
<script defer src="/js/webauthn-register.js?@project.version@"></script>
</body>
</html>
