<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{mfa.enable.title}, false)}"></th:block>
    <script defer src="/js/App.js" type="module"></script>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{mfa.enable.title}">Enable Your Authenticator App</h1>
            <div th:text="#{mfa.enable.description}">Use an authenticator apps to generate one-time passwords as a second factor for verifying your identity.</div>
        </div>

        <div class="container">
            <article>
<!--/*            <div class="text">*/-->
<!--/*                Use an authenticator app to scan the QR code.*/-->
<!--/*            </div>*/-->

            <div class="qrCode">
                <img th:src="${qrCode}" alt="Qr code">
            </div>
            <div class="text">
                <span th:text="#{mfa.enable.scanHelp.prefix}">Having trouble scanning?</span> <a id="showCode" th:text="#{mfa.enable.scanHelp.link}">Show code</a> <span th:text="#{mfa.enable.scanHelp.suffix}">to manually set up your authenticator app.</span>
            </div>

            <div class="text">
                <a th:href="${otpAuthUrl}" th:text="#{mfa.enable.openApp}">Open in your authenticator app</a>
            </div>

            <div id="setupKey" class="hide">
                <label th:text="#{mfa.enable.secret.label}">Your MFA Secret</label>
                <pre><code th:text="${secret}"></code></pre>
            </div>

            <form th:action="@{/mfa/enable}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

                <label for="code" th:text="#{mfa.code.label}">Authentication Code:</label>
                <input type="text" inputmode="numeric" id="code" name="code" autofocus autocomplete="one-time-code" th:attr="aria-invalid=${error != null} ? 'true' : null, aria-describedby=${error != null} ? 'code-error' : null"/>
                <span class="error" id="code-error" role="alert" th:if="${error != null}" th:text="#{mfa.code.error}">Invalid code, please try again</span>
                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <button type="submit">
                        <span th:text="#{mfa.verify}">Verify</span>
                    </button>
                </div>
            </form>

            </article>

            <div class="skipButton" th:if="${skipEnable}">
                <form th:action="@{/mfa/enable}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" name="code" value="skip" />
                    <button type="submit" th:text="#{mfa.enable.skip}">Skip For Now</button>
                </form>
            </div>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
