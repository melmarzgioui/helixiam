<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{mfa.totp.title}, false)}"></th:block>
    <script defer th:src="@{/js/App.js}" type="module"></script>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{mfa.totp.title}">Open Your Authenticator App</h1>
            <div class="description" th:text="#{mfa.totp.description}">Grab your authenticator app and add your authentication code</div>
        </div>

        <div class="container">
            <article>
            <form th:action="@{/mfa/totp}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

                <label for="code" th:text="#{mfa.code.label}">Authentication Code:</label>
                <input type="text" inputmode="numeric" id="code" name="code" autofocus placeholder="123456" autocomplete="one-time-code" th:attr="aria-invalid=${error != null} ? 'true' : null, aria-describedby=${error != null} ? 'code-error' : null"/>
                <span class="error" id="code-error" role="alert" th:if="${error != null}" th:text="#{mfa.code.error}">Invalid code, please try again</span>

                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <button type="submit">
                        <span th:text="#{mfa.verify}">Verify</span>
                    </button>
                </div>
            </form>

            <details class="recovery" th:open="${recoveryError != null}">
                <summary th:text="#{mfa.recovery.use}">Use a recovery code instead</summary>
                <form th:action="@{/mfa/recovery}" method="post" th:classappend="${recoveryError != null ? 'invalid' : 'valid'}">
                    <label for="recoveryCode" th:text="#{mfa.recovery.label}">Recovery code:</label>
                    <input type="text" id="recoveryCode" name="recoveryCode" autocomplete="off" placeholder="XXXX-XXXX" th:attr="aria-invalid=${recoveryError != null} ? 'true' : null, aria-describedby=${recoveryError != null} ? 'recovery-error' : null"/>
                    <span class="error" id="recovery-error" role="alert" th:if="${recoveryError != null}" th:text="#{mfa.recovery.error}">That recovery code is not valid or was already used</span>
                    <div class="spacer">&nbsp;</div>
                    <div class="buttonHolder">
                        <button type="submit"><span th:text="#{mfa.verify}">Verify</span></button>
                    </div>
                </form>
            </details>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
