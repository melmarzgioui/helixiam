<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#a3d4c4">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2f3033">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
    <title th:text="#{login.page.title}">HelixIAM - Login</title>
    <script defer src="/js/App.js?@project.version@" type="module"></script>
    <meta name="googlebot" content="noindex">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif" sizes="32x32">
    <link rel="icon" href="/img/favicon.avif" sizes="192x192">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">

    <header>
        <div class="headerBar">
            <a>
                <div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div>
            </a>
        </div>
    </header>

    <main>
        <div class="container title">
            <h3 th:text="#{mfa.totp.title}">Open Your Authenticator App</h3>
            <div class="description" th:text="#{mfa.totp.description}">Grab your authenticator app and add your authentication code</div>
        </div>

        <div class="container">
            <article>
            <form action="/mfa/totp" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

                <label for="code" th:text="#{mfa.code.label}">Authentication Code:</label>
                <input type="number" id="code" name="code" autofocus placeholder="XXXXXX" autocomplete="off"/>
                <span class="error" th:text="#{mfa.code.error}">Invalid code, please try again</span>

                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <button type="submit">
                        <span th:text="#{mfa.verify}">Verify</span>
                    </button>
                </div>
            </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
</body>
</html>
