<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{verify.confirm.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{verify.confirm.title}">Verify your email address</h1>
            <p class="hx-lead" th:text="#{verify.confirm.description}">Use this button to confirm your email address.</p>
        </div>
        <div class="container">
            <article>
                <form th:action="@{/verify-email}" method="post">
                    <input type="hidden" name="token" th:value="${token}"/>
                    <div class="buttonHolder">
                        <button type="submit"><span th:text="#{verify.confirm.submit}">Verify my email address</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
