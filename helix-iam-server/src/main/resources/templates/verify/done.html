<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(${verified} ? #{verify.done.title} : #{verify.invalid.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <!--/* One template for both outcomes: verified, or an invalid/used/expired link. */-->
        <div class="container title" th:if="${verified}">
            <h1 class="hx-title" th:text="#{verify.done.title}">Email address verified</h1>
            <p class="hx-lead" th:text="#{verify.done.description}">You can go back to the sign-in window and continue.</p>
        </div>
        <th:block th:unless="${verified}">
            <div class="container title">
                <h1 class="hx-title" th:text="#{verify.invalid.title}">This link does not work any more</h1>
            </div>
            <div class="container">
                <article>
                    <div class="hx-alert hx-alert-error" role="alert" th:text="#{verify.invalid.description}">Verification links work once and expire after 24 hours.</div>
                    <div class="text"><a th:href="@{/login}" th:text="#{magic.back}">Back to sign in</a></div>
                </article>
            </div>
        </th:block>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
