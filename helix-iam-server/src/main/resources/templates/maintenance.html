<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{maintenance.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <!--/* The card-page layout of the other pages: the title block, then the card. */-->
        <div class="container title">
            <h1 class="hx-title" th:text="#{maintenance.title}">Scheduled maintenance</h1>
            <div class="description" th:text="#{maintenance.description}">We are doing scheduled maintenance.</div>
        </div>

        <div class="container">
            <article>
                <p class="description" th:text="#{maintenance.retry.hint}">Please try again in a few minutes.</p>
                <div class="spacer">&nbsp;</div>
                <div class="buttonHolder">
                    <a class="button" th:href="@{/login}"><span th:text="#{maintenance.retry}">Try again</span></a>
                </div>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
