<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*
  Item 6: the themed page of an OAuth / OIDC error that cannot go back to the application (ProtocolErrorPageFilter).
  The title, lead and hint come from a fixed set per errorKind, never from the request. errorCode is a standard OAuth
  error code or empty (shown only under "Technical details"); errorReference is the id logged with the error.
  The way back is always a page of this realm (sign in, or the account page), never a URI the request named.
  No language switcher: switching would reload the page without the failed request.
*/-->
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{'protocolError.' + ${errorKind} + '.title'}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main th:with="toLogin=${errorKind == 'logout' or errorKind == 'forbidden'}">
        <div class="container title">
            <h1 class="hx-title" th:text="#{'protocolError.' + ${errorKind} + '.title'}">Something went wrong</h1>
            <p class="hx-lead" th:text="#{'protocolError.' + ${errorKind}}">The request could not be completed.</p>
        </div>

        <div class="container">
            <article class="hx-error-card">
                <p th:text="#{'protocolError.' + ${errorKind} + '.hint'}">Go back to the application and try again.</p>
                <div class="text">
                    <a th:if="${toLogin}" class="hx-back" th:href="@{/login}" th:text="#{protocolError.back.login}">Back to sign in</a>
                    <a th:unless="${toLogin}" class="hx-back" th:href="@{/account}" th:text="#{protocolError.back.account}">Go to your account</a>
                </div>
                <p class="hx-muted hx-small hx-reference"><span th:text="#{protocolError.referenceLabel}">Reference:</span>
                    <code th:text="${errorReference}">0000</code></p>
                <details class="hx-details hx-muted hx-small" th:if="${!#strings.isEmpty(errorCode)}">
                    <summary th:text="#{protocolError.details}">Technical details</summary>
                    <p th:text="#{protocolError.code(${errorCode})}">Error code: invalid_request</p>
                </details>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
