<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Action required', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h3>Action required</h3>
            <p class="hx-lead">Your administrator has asked you to complete the following before continuing:</p>
        </div>
        <div class="container">
            <article>
                <p class="hx-strong" th:text="${action}">ACTION</p>
                <form th:action="@{/required-actions/acknowledge}" method="post" role="form">
                    <div class="buttonHolder">
                        <button type="submit"><span>I have completed this — continue</span></button>
                    </div>
                </form>
            </article>
        </div>
    </main>
    <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
</div>
</body>
</html>
