<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{requiredAction.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{requiredAction.title}">Action required</h1>
            <p class="hx-lead" th:text="#{requiredAction.lead}">Your administrator has asked you to complete the following before continuing:</p>
        </div>
        <div class="container">
            <article>
                <p class="hx-strong" th:text="${actionLabel} ?: ${action}">Verify your email address</p>
                <form th:action="@{/required-actions/acknowledge}" method="post" role="form">
                    <div class="buttonHolder">
                        <button type="submit"><span th:text="#{requiredAction.continue}">I have done this, continue</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
