<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{requiredAction.updatePassword.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{requiredAction.updatePassword.title}">Update your password</h1>
            <p class="hx-lead" th:text="#{requiredAction.updatePassword.lead}">Your administrator requires you to set a new password before continuing.</p>
        </div>
        <div class="container">
            <article>
                <div class="hx-alert hx-alert-error" id="password-error" role="alert" th:if="${error}"
                     th:text="#{requiredAction.updatePassword.error}">The passwords are empty or do not match. Try again.</div>
                <form th:action="@{/required-actions/update-password}" method="post" role="form">
                    <label for="newPassword" th:text="#{requiredAction.updatePassword.new}">New password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password"
                           th:attr="aria-invalid=${error} ? 'true' : null, aria-describedby=${error} ? 'password-error' : null"/>
                    <label for="repeatPassword" th:text="#{requiredAction.updatePassword.repeat}">Repeat new password</label>
                    <input type="password" id="repeatPassword" name="repeatPassword" autocomplete="new-password"
                           th:attr="aria-invalid=${error} ? 'true' : null, aria-describedby=${error} ? 'password-error' : null"/>
                    <div class="buttonHolder">
                        <button type="submit"><span th:text="#{requiredAction.updatePassword.submit}">Set password</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
