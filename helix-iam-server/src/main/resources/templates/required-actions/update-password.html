<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KubeDNA — Update your password</title>
    <meta name="robots" content="noindex">
    <link rel="icon" th:href="@{/img/favicon.avif}">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar">
            <a><div class="logo"><img src="/img/kubedna-zw.png" alt="KubeDNA"></div></a>
        </div>
    </header>
    <main>
        <div class="container title">
            <h3>Update your password</h3>
            <p style="margin:.35rem 0 0;color:var(--fg-muted,#667)">Your administrator requires you to set a new password before continuing.</p>
        </div>
        <div class="container" th:if="${error}">
            <div class="actionError"><span>The passwords were empty or did not match. Please try again.</span></div>
        </div>
        <div class="container">
            <article>
                <form th:action="@{/required-actions/update-password}" method="post" role="form">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password"/>
                    <label for="repeatPassword">Repeat new password</label>
                    <input type="password" id="repeatPassword" name="repeatPassword" autocomplete="new-password"/>
                    <div class="buttonHolder">
                        <button type="submit"><i class="login"></i><span>Set password</span></button>
                    </div>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
</body>
</html>
