<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{verify.required.title}, false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{verify.required.title}">Verify your email address</h1>
            <p class="hx-lead" th:if="${email != null}" th:text="#{verify.required.description(${email})}">We sent a link to your address. Open it, then come back here.</p>
            <p class="hx-lead" th:if="${email == null}" th:text="#{verify.required.noemail}">Your account has no email address.</p>
        </div>
        <div class="container">
            <article>
                <div class="hx-alert hx-alert-success" role="status" th:if="${sent}" th:text="#{verify.required.sent}">A new verification link is on its way.</div>
                <div class="hx-alert hx-alert-error" role="alert" th:if="${rateLimited}" th:text="#{verify.required.ratelimited}">Too many emails were sent.</div>
                <div class="hx-alert hx-alert-error" role="alert" th:if="${notYet}" th:text="#{verify.required.notyet}">Your email address is not verified yet.</div>
                <form th:action="@{/required-actions/verify-email/continue}" method="post" data-verify="continue">
                    <div class="buttonHolder">
                        <button type="submit"><span th:text="#{verify.required.continue}">I have verified my email address — continue</span></button>
                    </div>
                </form>
                <form th:if="${email != null}" th:action="@{/required-actions/verify-email/resend}" method="post" data-verify="resend">
                    <div class="buttonHolder">
                        <button type="submit" class="secondary"><span th:text="#{verify.required.resend}">Send the link again</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
