<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/account :: accountHead(#{account.emailConfirm.title})}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" id="email-confirm-title" th:text="#{account.emailConfirm.title}">Confirm your new email address</h1>
            <p class="hx-lead" th:text="#{account.emailConfirm.lead}">Use this button to confirm this is your email address.</p>
        </div>

        <div class="container hx-account-form">
            <article>
                <form th:action="@{/account/email/verify}" method="post">
                    <input type="hidden" name="token" th:value="${token}"/>
                    <div class="buttonHolder">
                        <button type="submit" id="email-confirm"><span th:text="#{account.emailConfirm.submit}">Confirm my email address</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
