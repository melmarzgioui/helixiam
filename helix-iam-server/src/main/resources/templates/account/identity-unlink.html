<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Round 6: confirm disconnecting an identity provider (AccountIdentityLinkController). */-->
<head>
    <th:block th:replace="~{fragments/account :: accountHead(#{account.identities.unlinkTitle})}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <div class="hx-account-top">
                <a th:replace="~{fragments/account :: overviewLink}"></a>
                <a th:replace="~{fragments/account :: returnLink}"></a>
            </div>
            <h1 class="hx-title" th:text="#{account.identities.unlinkTitle}">Disconnect this account</h1>
            <p class="hx-lead" th:text="#{account.identities.unlinkLead(${identityName})}">You'll no longer be able to sign in with Corporate sign-in.</p>
        </div>

        <div class="container hx-account-form">
            <article>
                <form th:action="@{/account/identities/unlink}" method="post" id="identity-unlink-form">
                    <input type="hidden" name="alias" th:value="${identityAlias}">
                    <div class="buttonHolder">
                        <a class="button secondary" th:href="@{/account}" th:text="#{common.cancel}">Cancel</a>
                        <button type="submit" class="hx-btn hx-btn-danger hx-btn-solid" id="identity-unlink-confirm" th:text="#{account.identities.unlinkConfirm}">Disconnect</button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
