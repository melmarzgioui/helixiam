<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Task 21b: confirm unlinking an EU Digital Identity Wallet (AccountWalletController; step-up before this page). */-->
<head>
    <th:block th:replace="~{fragments/account :: accountHead(#{account.wallet.unlinkTitle})}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <div class="hx-account-top">
                <a th:replace="~{fragments/account :: overviewLink}"></a>
                <a th:replace="~{fragments/account :: returnLink}"></a>
            </div>
            <h1 class="hx-title" th:text="#{account.wallet.unlinkTitle}">Unlink your wallet</h1>
            <p class="hx-lead" th:text="#{account.wallet.unlinkLead(${walletName})}">You'll no longer be able to sign in with EU Digital Identity Wallet. You can link it again at any time.</p>
        </div>

        <div class="container hx-account-form">
            <article>
                <form th:action="@{/account/wallet/unlink}" method="post" id="wallet-unlink-form">
                    <input type="hidden" name="alias" th:value="${walletAlias}">
                    <div class="buttonHolder">
                        <a class="button secondary" th:href="@{/account}" th:text="#{common.cancel}">Cancel</a>
                        <button type="submit" class="hx-btn hx-btn-danger hx-btn-solid" id="wallet-unlink-confirm" th:text="#{account.wallet.unlinkConfirm}">Unlink wallet</button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
