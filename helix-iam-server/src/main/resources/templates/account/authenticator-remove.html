<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/account :: accountHead(#{account.remove.title})}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <div class="hx-account-top">
                <a th:replace="~{fragments/account :: overviewLink}"></a>
                <a th:replace="~{fragments/account :: returnLink}"></a>
            </div>
            <h1 class="hx-title" th:text="#{account.remove.title}">Remove your authenticator app</h1>
            <p class="hx-lead" th:text="#{account.remove.lead}">You'll sign in with only your password, and your recovery codes stop working.</p>
        </div>

        <div class="container hx-account-form">
            <article>
                <form th:action="@{/account/authenticator/remove}" method="post" id="remove-form">
                    <input th:replace="~{fragments/account :: csrfField}">
                    <div class="buttonHolder">
                        <a class="button secondary" th:href="@{/account}" th:text="#{common.cancel}">Cancel</a>
                        <button type="submit" class="hx-btn hx-btn-danger hx-btn-solid" id="remove-confirm" th:text="#{account.remove.confirm}">Remove authenticator</button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
