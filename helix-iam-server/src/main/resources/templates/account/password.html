<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/account :: accountHead(#{account.password.title})}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <div class="hx-account-top">
                <a th:replace="~{fragments/account :: overviewLink}"></a>
                <a th:replace="~{fragments/account :: returnLink}"></a>
            </div>
            <h1 class="hx-title" th:text="#{account.password.title}">Change your password</h1>
            <p class="hx-lead" th:text="#{account.password.lead}">Enter your current password, then choose a new one.</p>
        </div>

        <div class="container hx-account-form">
            <article>
                <p class="hx-alert hx-alert-error" role="alert" id="password-error" th:if="${failure != null or policyMessage != null}"
                   th:text="${policyMessage != null} ? ${policyMessage} : #{'account.error.' + ${failure}}">Your current password is not correct.</p>
                <form th:action="@{/account/password}" method="post" id="password-form">
                    <label for="currentPassword" th:text="#{account.password.current}">Current password</label>
                    <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required
                           th:attr="aria-invalid=${failure == 'password-wrong'} ? 'true' : null, aria-describedby=${failure == 'password-wrong'} ? 'password-error' : null">
                    <label for="newPassword" th:text="#{account.password.new}">New password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required
                           th:attr="aria-invalid=${policyMessage != null or failure == 'password-mismatch'} ? 'true' : null, aria-describedby=${policyMessage != null or failure == 'password-mismatch'} ? 'password-error' : null">
                    <label for="confirmPassword" th:text="#{account.password.confirm}">Repeat the new password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required
                           th:attr="aria-invalid=${failure == 'password-mismatch'} ? 'true' : null, aria-describedby=${failure == 'password-mismatch'} ? 'password-error' : null">
                    <div class="buttonHolder">
                        <a class="button secondary" th:href="@{/account}" th:text="#{common.cancel}">Cancel</a>
                        <button type="submit" id="password-save"><span th:text="#{account.password.save}">Change password</span></button>
                    </div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
