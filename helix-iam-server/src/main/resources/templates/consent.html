<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Authorise', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h3>Authorise <span th:text="${clientName}">the app</span></h3>
            <p class="hx-lead">
                <strong th:text="${clientName}">the app</strong> wants to access your account. Review the permissions and approve if you're happy.
            </p>
            <p th:if="${userCode != null and !userCode.isEmpty()}" class="hx-lead">
                You entered the code <span class="consentCode" th:text="${userCode}">WDJB-MJHT</span> — check it matches what your device shows.
            </p>
        </div>

        <div class="container">
            <article class="hx-narrow">
                <form th:action="@{${requestURI}}" method="post" role="form">
                    <input type="hidden" name="client_id" th:value="${clientId}"/>
                    <input type="hidden" name="state" th:value="${state}"/>
                    <input th:if="${userCode != null and !userCode.isEmpty()}" type="hidden" name="user_code" th:value="${userCode}"/>
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <p class="hx-strong">This app will be able to:</p>
                    <ul class="consentScopes">
                        <li th:each="s : ${scopes}">
                            <input type="checkbox" name="scope" th:value="${s.scope}" th:id="${s.scope}" checked/>
                            <label th:for="${s.scope}">
                                <span class="scopeName" th:text="${s.description}">Permission</span>
                                <span class="scopeDesc" th:text="'(' + ${s.scope} + ')'">(scope)</span>
                            </label>
                        </li>
                    </ul>
                    <p th:if="${scopes.isEmpty()}" class="hx-muted">No additional permissions requested.</p>

                    <div class="buttonHolder">
                        <button type="submit" name="cancel" value="true" class="secondary"><span>Cancel</span></button>
                        <button type="submit"><span>Approve</span></button>
                    </div>
                </form>
            </article>
        </div>
    </main>
    <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
</div>
</body>
</html>
