<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{profile.title}, false)}"></th:block>
    <script defer src="/js/App.js" type="module"></script>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container title">
            <h1 class="hx-title" th:text="#{profile.title}">My profile</h1>
        </div>
        <div class="container">
            <article>
                <dl class="hx-profile">
                    <dt th:text="#{profile.username}">Username</dt>
                    <dd th:text="${profile.username()} ?: #{profile.notSet}" th:classappend="${profile.username() == null} ? 'hx-muted'">ada</dd>
                    <dt th:text="#{profile.email}">Email address</dt>
                    <dd th:text="${profile.email()} ?: #{profile.notSet}" th:classappend="${profile.email() == null} ? 'hx-muted'">ada@example.com</dd>
                    <dt th:text="#{profile.givenName}">First name</dt>
                    <dd th:text="${profile.givenName()} ?: #{profile.notSet}" th:classappend="${profile.givenName() == null} ? 'hx-muted'">Ada</dd>
                    <dt th:text="#{profile.familyName}">Last name</dt>
                    <dd th:text="${profile.familyName()} ?: #{profile.notSet}" th:classappend="${profile.familyName() == null} ? 'hx-muted'">Lovelace</dd>
                    <dt th:text="#{profile.phone}">Phone number</dt>
                    <dd th:text="${profile.phone()} ?: #{profile.notSet}" th:classappend="${profile.phone() == null} ? 'hx-muted'">+31 6 1234 5678</dd>
                </dl>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
