<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#a3d4c4">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2f3033">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
    <title>HelixIAM - Profile</title>

    <meta name="googlebot" content="noindex">
    <meta name="robots" content="noindex">
    <script defer src="/js/App.js?@project.version@" type="module"></script>
    <link rel="icon" href="/img/favicon.avif" sizes="32x32">
    <link rel="icon" href="/img/favicon.avif" sizes="192x192">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">

    <header>
        <div class="headerBar">
            <a>
                <div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div>
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <h3>My profile</h3>
        </div>

        <div class="container">
            <label>Email Address</label>
            <span th:text="*{username}"/>

            <label>First Name</label>
            <span th:text="*{firstName}"/>

            <label>Last Name</label>
            <span th:text="*{lastName}"/>

            <label>Phone Number</label>
            <span th:text="*{mobilePhone}"/>
        </div>
    </main>
    <footer></footer>
</div>
</body>
</html>
