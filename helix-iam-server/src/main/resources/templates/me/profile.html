<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('My profile', false)}"></th:block>
    <script defer src="/js/App.js" type="module"></script>
</head>
<body>
<div class="mainWrapper">

    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>
        <div class="container">
            <h3>My profile</h3>
        </div>

        <div class="container">
            <label>Email Address</label>
            <span th:text="*{username}"/>

            <label>First Name</label>
            <span th:text="*{firstName}"/>

            <label>Last Name</label>
            <span th:text="*{lastName}"/>

            <label>Phone Number</label>
            <span th:text="*{mobilePhone}"/>
        </div>
    </main>
    <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
</div>
</body>
</html>
