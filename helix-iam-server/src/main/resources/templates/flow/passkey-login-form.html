<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>KubeDNA - Sign in with a passkey</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img src="/img/kubedna-zw.png" alt="KubeDNA"></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Sign in with a passkey</h3>
            <div class="description">No password needed — pick the passkey saved on this device.</div>
        </div>
        <div class="container">
            <article>
                <form id="passkeyForm" th:action="${flowAction}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <!-- Conditional-UI autofill anchor: browsers surface discoverable passkeys in this field. -->
                    <input type="text" id="passkeyHint" name="passkeyHint" autocomplete="username webauthn"
                           placeholder="Use a passkey" aria-label="Use a passkey" autofocus/>
                    <input type="hidden" id="credentialId" name="credentialId"/>
                    <input type="hidden" id="authenticatorData" name="authenticatorData"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <input type="hidden" id="signature" name="signature"/>
                    <input type="hidden" id="userHandle" name="userHandle"/>
                    <span class="error">Passkey not recognised, please try again</span>
                    <div class="spacer">&nbsp;</div>
                    <div class="buttonHolder"><button type="button" id="passkeyBtn"><span>Use a passkey</span></button></div>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<script th:inline="javascript">
    const challengeB64 = /*[[${passkeyLoginChallenge}]]*/ '';
    const rpId = /*[[${rpId}]]*/ 'localhost';

    function b64urlToBytes(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }
    function bytesToB64url(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function submitAssertion(assertion) {
        const r = assertion.response;
        document.getElementById('credentialId').value = bytesToB64url(assertion.rawId);
        document.getElementById('authenticatorData').value = bytesToB64url(r.authenticatorData);
        document.getElementById('clientDataJSON').value = bytesToB64url(r.clientDataJSON);
        document.getElementById('signature').value = bytesToB64url(r.signature);
        document.getElementById('userHandle').value = r.userHandle ? bytesToB64url(r.userHandle) : '';
        document.getElementById('passkeyForm').submit();
    }

    // Usernameless / resident-key: NO allowCredentials, so the authenticator offers discoverable passkeys
    // and the userHandle in the response identifies the signer (resolved server-side).
    function publicKeyOptions() {
        return {
            challenge: b64urlToBytes(challengeB64),
            rpId: rpId,
            userVerification: 'required',
            timeout: 60000
        };
    }

    // Conditional UI: prompt inline in the autofill dropdown if the browser supports it.
    async function startConditional() {
        try {
            if (!window.PublicKeyCredential || !PublicKeyCredential.isConditionalMediationAvailable) return;
            if (!(await PublicKeyCredential.isConditionalMediationAvailable())) return;
            const assertion = await navigator.credentials.get({ publicKey: publicKeyOptions(), mediation: 'conditional' });
            if (assertion) submitAssertion(assertion);
        } catch (e) {
            console.debug('Conditional passkey UI unavailable', e);
        }
    }

    // Explicit modal prompt on button click (fallback / user-initiated).
    async function startModal() {
        try {
            const assertion = await navigator.credentials.get({ publicKey: publicKeyOptions() });
            if (assertion) submitAssertion(assertion);
        } catch (e) {
            console.error('Passkey login failed', e);
        }
    }

    document.getElementById('passkeyBtn').addEventListener('click', startModal);
    window.addEventListener('load', startConditional);
</script>
</body>
</html>
