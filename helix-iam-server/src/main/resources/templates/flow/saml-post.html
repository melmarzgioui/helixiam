<!DOCTYPE html>
<!-- Helix IAM E6: SAML HTTP-POST binding — auto-submits the (signed) AuthnRequest to the IdP.
     Used by DigiD/eHerkenning, which require the POST binding rather than HTTP-Redirect. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Redirecting to your identity provider…</title>
    <!-- Security review M3 (CSP): auto-submit moved from an inline onload handler to /js/saml-post.js
         so the page runs under `script-src 'self'` with NO 'unsafe-inline'. -->
    <script defer src="/js/saml-post.js"></script>
</head>
<body>
<noscript>
    <p>JavaScript is disabled. Click the button to continue to your identity provider.</p>
</noscript>
<form method="post" th:action="${action}">
    <input type="hidden" th:each="field : ${fields}" th:name="${field.key}" th:value="${field.value}"/>
    <noscript><button type="submit">Continue</button></noscript>
</form>
</body>
</html>
