<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HelixIAM - Login</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Passkey</h3>
            <div class="description">Use your passkey (fingerprint, face, or security key) to continue.</div>
        </div>
        <div class="container">
            <article>
                <form id="webauthnForm" th:action="${flowAction}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}"
                      th:data-challenge="${webauthnChallenge}" th:data-rp-id="${rpId}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" id="credentialId" name="credentialId"/>
                    <input type="hidden" id="authenticatorData" name="authenticatorData"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <input type="hidden" id="signature" name="signature"/>
                    <input type="hidden" id="userHandle" name="userHandle"/>
                    <span class="error">Passkey verification failed, please try again</span>
                    <div class="spacer">&nbsp;</div>
                    <div class="buttonHolder"><button type="button" id="webauthnBtn"><span>Use Passkey</span></button></div>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<!-- Security review M3 (CSP): ceremony JS externalised to /js/webauthn-login.js (script-src 'self'). -->
<script defer src="/js/webauthn-login.js?@project.version@"></script>
</body>
</html>
