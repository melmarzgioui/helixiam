<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Security key', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title">Passkey</h1>
            <div class="description">Use your passkey (fingerprint, face, or security key) to continue.</div>
        </div>
        <div class="container">
            <article>
                <form id="webauthnForm" th:action="${flowAction}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}"
                      th:data-challenge="${webauthnChallenge}" th:data-rp-id="${rpId}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" id="credentialId" name="credentialId"/>
                    <input type="hidden" id="authenticatorData" name="authenticatorData"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <input type="hidden" id="signature" name="signature"/>
                    <input type="hidden" id="userHandle" name="userHandle"/>
                    <span class="error" role="alert" th:if="${error != null}">Passkey verification failed, please try again</span>
                    <div class="spacer">&nbsp;</div>
                    <div class="buttonHolder"><button type="button" id="webauthnBtn"><span>Use Passkey</span></button></div>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
<!--/* Security review M3 (CSP): ceremony JS externalised to /js/webauthn-login.js (script-src 'self'). */-->
<script defer src="/js/webauthn-login.js"></script>
</body>
</html>
