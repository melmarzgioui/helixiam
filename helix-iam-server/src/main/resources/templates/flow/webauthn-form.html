<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>KubeDNA - Login</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img src="/img/kubedna-zw.png" alt="KubeDNA"></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Passkey</h3>
            <div class="description">Use your passkey (fingerprint, face, or security key) to continue.</div>
        </div>
        <div class="container">
            <article>
                <form id="webauthnForm" th:action="${flowAction}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="hidden" id="credentialId" name="credentialId"/>
                    <input type="hidden" id="authenticatorData" name="authenticatorData"/>
                    <input type="hidden" id="clientDataJSON" name="clientDataJSON"/>
                    <input type="hidden" id="signature" name="signature"/>
                    <input type="hidden" id="userHandle" name="userHandle"/>
                    <span class="error">Passkey verification failed, please try again</span>
                    <div class="spacer">&nbsp;</div>
                    <div class="buttonHolder"><button type="button" id="webauthnBtn"><span>Use Passkey</span></button></div>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<script th:inline="javascript">
    const challengeB64 = /*[[${webauthnChallenge}]]*/ '';
    const rpId = /*[[${rpId}]]*/ 'localhost';

    function b64urlToBytes(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }
    function bytesToB64url(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startPasskey() {
        try {
            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: b64urlToBytes(challengeB64),
                    rpId: rpId,
                    userVerification: 'preferred',
                    timeout: 60000
                }
            });
            const r = assertion.response;
            document.getElementById('credentialId').value = bytesToB64url(assertion.rawId);
            document.getElementById('authenticatorData').value = bytesToB64url(r.authenticatorData);
            document.getElementById('clientDataJSON').value = bytesToB64url(r.clientDataJSON);
            document.getElementById('signature').value = bytesToB64url(r.signature);
            document.getElementById('userHandle').value = r.userHandle ? bytesToB64url(r.userHandle) : '';
            document.getElementById('webauthnForm').submit();
        } catch (e) {
            console.error('Passkey failed', e);
        }
    }
    document.getElementById('webauthnBtn').addEventListener('click', startPasskey);
    // Auto-prompt on load for a smoother UX.
    window.addEventListener('load', startPasskey);
</script>
</body>
</html>
