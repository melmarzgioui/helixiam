<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Sign in with your phone', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h3>Scan to sign in</h3>
            <div class="description">Open the sign-in app on your enrolled phone and scan this code, or
                approve the prompt. The link refreshes periodically for security.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${error}" class="hx-alert hx-alert-error" role="alert">QR sign-in failed, please try again.</div>
                <div id="qrLink" class="description hx-break"></div>
                <div id="qrStatus" class="description">Waiting for approval…</div>
                <form id="qrForm" th:action="${flowAction}" method="post"
                      th:data-session-id="${qrSessionId}" th:data-token="${qrToken}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                </form>
            </article>
        </div>
    </main>
    <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
</div>
<!--/* Security review M3 (CSP): polling JS externalised to /js/qr-login.js (script-src 'self'). */-->
<script defer src="/js/qr-login.js"></script>
</body>
</html>
