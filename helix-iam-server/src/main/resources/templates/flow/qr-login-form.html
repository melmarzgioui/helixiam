<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HelixIAM - Login</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img th:if="${brandingLogo != null}" th:src="${brandingLogo}" alt="Logo"><span th:unless="${brandingLogo != null}" class="hx-wordmark">Helix<b>IAM</b><i class="hx-spark" aria-hidden="true"></i></span></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Scan to sign in</h3>
            <div class="description">Open the HelixIAM app on your enrolled phone and scan this code, or
                approve the prompt. The link refreshes periodically for security.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${error}" class="error" style="display:block">QR sign-in failed, please try again.</div>
                <div id="qrLink" class="description" style="word-break:break-all"></div>
                <div id="qrStatus" class="description">Waiting for approval…</div>
                <form id="qrForm" th:action="${flowAction}" method="post"
                      th:data-session-id="${qrSessionId}" th:data-token="${qrToken}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<!-- Security review M3 (CSP): polling JS externalised to /js/qr-login.js (script-src 'self'). -->
<script defer src="/js/qr-login.js?@project.version@"></script>
</body>
</html>
