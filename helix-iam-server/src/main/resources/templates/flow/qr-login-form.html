<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#a3d4c4">
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>KubeDNA - Login</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/favicon.avif">
</head>
<body>
<div class="mainWrapper">
    <header>
        <div class="headerBar"><a><div class="logo"><img src="/img/kubedna-zw.png" alt="KubeDNA"></div></a></div>
    </header>
    <main>
        <div class="container title">
            <h3>Scan to sign in</h3>
            <div class="description">Open the KubeDNA app on your enrolled phone and scan this code, or
                approve the prompt. The link refreshes periodically for security.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${error}" class="error" style="display:block">QR sign-in failed, please try again.</div>
                <div id="qrLink" class="description" style="word-break:break-all"></div>
                <div id="qrStatus" class="description">Waiting for approval…</div>
                <form id="qrForm" th:action="${flowAction}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                </form>
            </article>
        </div>
    </main>
    <footer></footer>
</div>
<script th:inline="javascript">
    const sessionId = /*[[${qrSessionId}]]*/ '';
    let token = /*[[${qrToken}]]*/ '';

    // Render the cross-device deep link the phone scans. (A QR image lib renders this in the app/UX;
    // shown as text here so the flow is functional without bundling a QR renderer.)
    function renderLink() {
        document.getElementById('qrLink').textContent = 'helix://qr-login/' + sessionId + '?t=' + token;
    }

    // Short-poll the shared store. Deliberately NOT SSE: polling is stateless and any publisher
    // instance can answer, so it scales horizontally without held connections or cross-node push.
    async function poll() {
        try {
            const res = await fetch('/qr/' + encodeURIComponent(sessionId), {headers: {'Accept': 'application/json'}});
            const data = await res.json();
            if (data.token) { token = data.token; renderLink(); }
            if (data.status === 'CONFIRMED') {
                document.getElementById('qrStatus').textContent = 'Approved — signing you in…';
                document.getElementById('qrForm').submit(); // run the authenticator action (consume + login)
                return;
            }
            if (data.status === 'EXPIRED') {
                document.getElementById('qrStatus').textContent = 'This code expired. Refresh to try again.';
                return;
            }
        } catch (e) { /* transient — keep polling */ }
        setTimeout(poll, 2500);
    }

    renderLink();
    setTimeout(poll, 2500);
</script>
</body>
</html>
