<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Verify your device', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h3>Approve on your device</h3>
            <div class="description">Approve this sign-in on your enrolled device. The device signs the
                challenge with its hardware key.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${error}" class="hx-alert hx-alert-error" role="alert">Device verification failed, please try again.</div>
                <!--/*
                    E4.1 ships the server-side device factor (challenge issuance + ES256 verification via
                    the Credential SPI). Cross-device delivery is wired in later stories: a QR/SSE flow
                    (E4.2) and FCM/APNs push with number matching (E4.3) replace this manual form. Until
                    then the enrolled device posts deviceId + base64url(DER signature) over the challenge.
                */-->
                <form id="deviceForm" th:action="${flowAction}" method="post" th:classappend="${error != null ? 'invalid' : 'valid'}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <label>Device ID<input type="text" name="deviceId" autocomplete="off"/></label>
                    <label>Signature (base64url)<input type="text" name="signature" autocomplete="off"/></label>
                    <div class="buttonHolder"><button type="submit"><span>Verify device</span></button></div>
                </form>
            </article>
        </div>
    </main>
    <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
</div>
</body>
</html>
