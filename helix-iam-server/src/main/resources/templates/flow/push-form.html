<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead('Approve on your phone', false)}"></th:block>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>
    <main>
        <div class="container title">
            <h1 class="hx-title">Approve on your phone</h1>
            <div class="description">We sent a notification to your enrolled device. Tap the number below
                to approve.</div>
        </div>
        <div class="container">
            <article>
                <div th:if="${error}" class="hx-alert hx-alert-error" role="alert">Approval failed or was denied, please try again.</div>
                <div id="pushNumber" class="hx-push-number" th:text="${pushNumber}">--</div>
                <div id="pushStatus" class="description">Waiting for approval…</div>
                <form id="pushForm" th:action="${flowAction}" method="post" th:data-push-id="${pushId}"
                      th:data-poll-url="@{/push/{id}(id=${pushId})}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                </form>
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
<!--/* Security review M3 (CSP): polling JS externalised to /js/push-login.js (script-src 'self'). */-->
<script defer th:src="@{/js/push-login.js}"></script>
</body>
</html>
