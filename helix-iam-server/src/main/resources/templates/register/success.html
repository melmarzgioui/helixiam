<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: hxHead(#{register.success.title}, false)}"></th:block>
    <script defer th:src="@{/js/App.js}" type="module"></script>
</head>
<body>
<div class="mainWrapper">
    <header th:replace="~{fragments/theme :: hxHeader(false)}"></header>

    <main>

        <div class="container center">
            <article>
                <div class="actionSuccess" >
                    <i class="done"></i>
                    <h1 class="hx-title" th:text="#{register.success.title}">Account Successfully Created</h1>
                    <span class="addition" th:text="#{register.success.message}">Check your inbox and give that link a click to make your account official!</span>
                </div>
                <div class="spacer">&nbsp;</div>
                <div class="spacer">&nbsp;</div>
                <!--/* Item A8: back into the pending sign-in, else the realm's landing page on the app, else the login page. */-->
                <div class="buttonHolder">
                    <a class="button continueLogin" th:href="${continueUrl} ?: @{/login}">
                        <span th:text="#{common.continue}">Continue</span>
                    </a>
                </div>
                <!--/* Item A7: the code in the email can be typed here too. */-->
                <p class="subtext"><a th:href="@{/register/verify}" th:text="#{register.success.enterCode}">Enter the code from the email</a></p>
<!--/*            <div class="spacer">&nbsp;</div>*/-->
<!--/*            <div class="spacer">&nbsp;</div>*/-->
            </article>
        </div>
        <footer th:replace="~{fragments/theme :: hxFooter}"></footer>
    </main>
</div>
</body>
</html>
