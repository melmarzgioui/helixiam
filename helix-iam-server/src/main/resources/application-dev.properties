# Local dev overrides (profile: dev). Standalone Postgres on localhost + dev-friendly toggles.
# Folds the former application-dev-publisher.properties (strip-RabbitMQ merge, Task 5).
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kubeiam}
spring.readonly.datasource.url=jdbc:postgresql://${DB_RO_HOST:${DB_HOST:localhost}}:${DB_PORT:5432}/${DB_NAME:kubeiam}

database.encryption=${DB_ENCRYPTION:0f31bbdc3193a96c859c2e24b34da89e}

# From application-dev-publisher.properties: local SP origin + dev auth toggles.
mfnr.publisher.origin=http://localhost:8080,http://kubedna-dashboard:8090
sp.base.url=http://kubedna-dashboard:8090
mfa.enabled=false
user.register.enabled=true
spring.web.resources.chain.strategy.content.enabled=true

