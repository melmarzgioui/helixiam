# Local dev overrides (profile: dev). Standalone Postgres on localhost + dev-friendly toggles.
# Folds the former application-dev-publisher.properties (strip-RabbitMQ merge, Task 5).
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kubeiam}
spring.readonly.datasource.url=jdbc:postgresql://${DB_RO_HOST:${DB_HOST:localhost}}:${DB_PORT:5432}/${DB_NAME:kubeiam}

database.encryption=${DB_ENCRYPTION:0f31bbdc3193a96c859c2e24b34da89e}

# From application-dev-publisher.properties: local SP origin + dev auth toggles.
mfnr.publisher.origin=http://localhost:8080,http://kubedna-dashboard:8090
sp.base.url=http://kubedna-dashboard:8090
mfa.enabled=false
user.register.enabled=true
spring.web.resources.chain.strategy.content.enabled=true

# ---------------------------------------------------------------------------
# Local-dev relaxations of the production hardening (security review H3 / M4 / M5 / L3).
# These are DEV-ONLY: the secure defaults live in application.properties.
# ---------------------------------------------------------------------------
# H3: full error detail is useful locally; prod returns neither message nor binding errors.
server.error.include-message=always
server.error.include-binding-errors=always

# M4/M5: local dev is plain HTTP on localhost, so a Secure-only cookie would never be sent back.
# One knob for BOTH the session cookie and the XSRF-TOKEN cookie.
helix.security.cookie-secure=false

# L3: expose Swagger UI + /v3/api-docs anonymously while developing against the admin API.
helix.springdoc.public=true

# M6 (SSRF): local dev routinely points webhooks / SCIM targets / brokers at localhost, so relax the
# OutboundUrlGuard block-private policy here. DEV-ONLY: the secure default (reject internal/metadata
# addresses) lives in application.properties. The bean-wired dispatchers honour this property directly;
# the two non-bean seams (FAPI request-object filter, per-provider upstream-logout client) read the
# HELIX_EGRESS_ALLOW_PRIVATE env var instead, so export it too if you exercise those against localhost.
helix.egress.allow-private=true

