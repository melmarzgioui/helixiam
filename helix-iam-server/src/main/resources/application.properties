# ============================================================================
# HelixIAM Server — merged standalone config (strip-RabbitMQ migration, Task 5).
# Folds the former subscriber's application.properties and the former publisher's
# application-publisher.properties into ONE default profile. There is no broker: the
# former queue-backed stores now delegate in-process, via the *LocalAdapter @Components,
# to the Postgres-backed domain services (see ADAPTERS.md). Redis is kept for HTTP session.
# ============================================================================

# ---------------------------------------------------------------------------
# Web front (from publisher): port, registration, maintenance, static chain.
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
user.register.enabled=${USER_REGISTRATION_ENABLED:false}
app.maintenance=${MAINTENANCE:false}
spring.web.resources.chain.strategy.content.enabled=true

# M6 (SSRF): server-initiated calls to admin/DCR/realm-configurable URLs (webhooks, SCIM targets,
# OIDC-broker token/JWKS, DCR client JWKS, WIF jwksUri, eID artifact resolver, upstream/back-channel
# logout, realm-config'd notification HTTP endpoints) are validated by OutboundUrlGuard. SECURE DEFAULT:
# reject hosts that resolve to loopback/link-local (incl. 169.254.169.254)/private/multicast. Set true
# ONLY for local dev (application-dev.properties) to allow pointing outbound URLs at localhost.
helix.egress.allow-private=${HELIX_EGRESS_ALLOW_PRIVATE:false}

# Anonymous-access whitelist + allowed CORS origins for the login/registration UI.
# Security review M3 (CSP): /js/** (was /js/App.js**) so the CSP-externalised page scripts
# (webauthn-register.js, webauthn-login.js, passkey-login.js, qr-login.js, push-login.js, saml-post.js)
# load as static `script-src 'self'` assets on the anonymous login/reset/register pages too.
helix.security.whitelist=/login,/register,/register/verify/**,/reset/**,/css/**,/js/**,/img/**,/connect/logout**
helix.security.origin=${SP_BASE_URL},${IDP_BASE_URL}
default.security.filter.enabled=false

# External base URLs. sp.base.url = the SP/dashboard; idp.base.url = this IdP's own external
# base (the federation broker callback /broker/{alias}/callback is served by the IdP itself).
# No production-looking fallback: outside the dev profile the server fail-fasts when these are unset
# (see io.helixiam.common.startup.ProductionReadinessCheck). The dev profile sets localhost values.
sp.base.url=${SP_BASE_URL:}
idp.base.url=${IDP_BASE_URL:}

# Multipart (image upload) + OIDC claim mapping + initial service-provider config.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
mapping.oidc.file=/mapping/claim-oidc-mapping.json
sp.config.location=/oauth2/sp.properties

# ---------------------------------------------------------------------------
# Datasource — ONE Postgres (from subscriber). io.helixiam.persistence.DataSourceConfiguration
# defines the (routing) DataSource bean, so Boot's DataSourceAutoConfiguration backs off; when
# spring.readonly.datasource.url is unset both routing keys resolve to the read-write pool.
# PROD-1: every coordinate is an env placeholder so the server runs standalone; defaults
# reproduce the in-cluster KubeDNA topology. SPRING_DATASOURCE_URL still wins if set.
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:helixiam}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helixiam}
spring.readonly.datasource.url=jdbc:postgresql://${DB_RO_HOST:${DB_HOST:localhost}}:${DB_PORT:5432}/${DB_NAME:helixiam}
database.encryption=${DB_ENCRYPTION:}
# Outside the dev profile the server fail-fasts when database.encryption is unset (at-rest secrets
# would be plaintext). Set this to true to accept that risk explicitly instead.
helix.allow-plaintext-secrets=${HELIX_ALLOW_PLAINTEXT_SECRETS:false}

# Schema management (Helix IAM PROD-4). Two mutually-exclusive paths, toggled by
# HELIX_MIGRATIONS_ENABLED. DEFAULT (false) runs the idempotent schema.sql via spring.sql.init every
# start; true hands the schema to Flyway (db/migration/V*) — set HELIX_SQL_INIT_MODE=never alongside it,
# and HELIX_FLYWAY_BASELINE_VERSION to your current schema version when adopting Flyway on an existing DB.
#
# NOTE (see CHANGES-1.0.md O5): making Flyway the DEFAULT is DEFERRED. The V1..V8 baseline is not yet
# verified-equivalent to schema.sql — the app fails to boot on the Flyway path (ServiceProviderService
# init hits a DuplicateException). Reconcile the two schemas (diff structure/constraints) before flipping.
spring.sql.init.mode=${HELIX_SQL_INIT_MODE:always}
spring.flyway.enabled=${HELIX_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${HELIX_FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# ---------------------------------------------------------------------------
# Stores (strip-RabbitMQ). The OAuth2-authorization (token) store defaults to the
# in-process implementation: helix.iam.token-store is left unset, so PersistenceConfig's
# matchIfMissing bean (QueueOAuth2AuthorizationService) wires — which now delegates through
# AuthorizationStoreLocalAdapter to the Postgres-backed AuthorizationStoreService, NOT a broker.
# Set HELIX_TOKEN_STORE=redis only for the high-throughput Redis tier.
#
# HTTP session store = Redis (project decision). session-store is deliberately NOT "queue", so
# QueueHttpSessionConfig backs off and Spring Session Data Redis manages HTTP sessions.
# ---------------------------------------------------------------------------
helix.iam.session-store=${HELIX_SESSION_STORE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# Session cookie + transport (security review M4/M5). HelixIAM is expected to run behind a
# TLS-terminating ingress, so:
#   * forward-headers-strategy=framework makes Tomcat honour X-Forwarded-Proto/-For, which is what
#     ServletRequest.isSecure() (→ Secure cookie decisions, HSTS) and absolute-URL generation read.
#     Without it the app believes every request is plain HTTP and silently drops the Secure flag.
#   * the session cookie's Secure flag is PINNED rather than left to isSecure(); default SECURE.
#     Plain-HTTP local dev flips it off via application-dev.properties (helix.security.cookie-secure).
#   * SameSite stays Lax — NOT Strict: an IdP legitimately receives cross-site top-level POSTs and
#     redirects (SAML POST binding, OIDC form_post, RP-initiated logout). Strict breaks those flows.
# helix.security.cookie-secure is the single knob; it also drives the XSRF-TOKEN cookie (SecurityConfig).
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework
helix.security.cookie-secure=${HELIX_COOKIE_SECURE:true}
server.servlet.session.cookie.secure=${helix.security.cookie-secure}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax

# Helix IAM E2.4: data-driven authentication-flow engine (default off; live login path unchanged).
helix.flow-engine.enabled=${HELIX_FLOW_ENGINE_ENABLED:false}

# ---------------------------------------------------------------------------
# SAML2 IdP role (Helix IAM E7.1/E7.2). Enabled for the e2e sandbox so relying parties can do
# SAML2 SSO/SLO. The keypair below is a self-signed DEV cert (10y, RSA-2048) for local/e2e use
# only — NOT a production secret. \n is read as a newline by java.util.Properties.
# Relying parties are registered via the admin API/console and persisted per realm.
# ---------------------------------------------------------------------------
helix.idp.saml.enabled=${HELIX_SAML_IDP_ENABLED:true}
helix.idp.saml.entityId=${HELIX_SAML_IDP_ENTITY_ID:http://localhost:8083/realms/master}
helix.idp.saml.signingCertificate=${HELIX_SAML_IDP_SIGNING_CERTIFICATE:}
helix.idp.saml.signingPrivateKey=${HELIX_SAML_IDP_SIGNING_PRIVATE_KEY:}

# ---------------------------------------------------------------------------
# Error body, observability, API docs (from publisher).
#
# Security review H3: error bodies must not echo exception messages / binding errors / stack traces —
# they leak internal detail and enable user/realm enumeration. All four are pinned closed here;
# application-dev.properties re-opens message + binding errors for local debugging.
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security review L2: /actuator/info is no longer exposed (build/git info disclosure with no
# operational value here). health (+ its probes) stays anonymous — it is the k8s liveness/readiness
# probe. prometheus stays exposed; whether it is ANONYMOUS is now an explicit switch, see
# helix.actuator.prometheus-anonymous below.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=${HELIX_HTTP_HISTOGRAM:false}
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s

# /actuator/prometheus anonymity. Default TRUE so in-cluster Prometheus scraping keeps working
# unchanged; metric names/labels are low-sensitivity but not zero-sensitivity, so RESTRICT THE SCRAPE
# PATH AT THE NETWORK LAYER (NetworkPolicy / ingress rule) — or set this to false, which pushes
# /actuator/prometheus behind the normal authenticated gate.
helix.actuator.prometheus-anonymous=${HELIX_ACTUATOR_PROMETHEUS_ANONYMOUS:false}

# Agent (NHI) on-behalf-of delegation exchange (/agent/delegation/token). Secure-by-default hardening:
#  - require-actor-auth (default TRUE): the agent must authenticate its client (client_secret_basic or
#    client_secret_post) on the exchange, not merely present its bearer actor_token. Set false only to
#    restore the pre-1.0 bearer-only behavior for existing agent callers during migration.
#  - require-subject-binding (default TRUE): the user's subject_token must name the agent (aud/azp or a
#    may_act claim). Set false for the looser legacy behavior.
#  - max-chain-depth (default 3): cap on nested delegation (act) chain depth.
helix.agent.delegation.require-actor-auth=${HELIX_AGENT_DELEGATION_REQUIRE_ACTOR_AUTH:true}
helix.agent.delegation.require-subject-binding=${HELIX_AGENT_DELEGATION_REQUIRE_SUBJECT_BINDING:true}
helix.agent.delegation.max-chain-depth=${HELIX_AGENT_DELEGATION_MAX_CHAIN_DEPTH:3}

# Security review L3: the OpenAPI document describes the whole /admin/** surface. It is NOT public by
# default — with this false, /v3/api-docs + /swagger-ui fall through to `anyRequest().authenticated()`
# instead of permitAll. application-dev.properties sets it true for local API exploration.
helix.springdoc.public=${HELIX_API_DOCS_PUBLIC:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.groups-order=ASC

# ---------------------------------------------------------------------------
# Notifications (Task 4, strip-RabbitMQ): io.helixiam.notification.Notifier delivery. Realm-scoped
# email/SMS providers (Realm Settings > Messaging > Providers) are always preferred when the
# in-flight request is realm-routed and has one enabled; the settings below are only the GLOBAL SMTP
# fallback io.helixiam.notification.delivery.SmtpNotifier uses when no realm provider applies (e.g.
# the platform-level signup/reset-password notifications). See io.helixiam.notification.delivery
# .NotificationDeliveryConfig for the full provider-selection wiring.
# ---------------------------------------------------------------------------
# helix.notification.provider=smtp
#   smtp (default) = SmtpNotifier (real email via realm provider or global SMTP below; SMS via the
#                     realm's configured SmsDriver; push logs — see io.helixiam.notification.delivery
#                     .spi.AppSender for the extension point).
#   log             = force io.helixiam.notification.LoggingNotifier (dev/no-mail-server).
# helix.notification.smtp.host=
# helix.notification.smtp.port=587
# helix.notification.smtp.username=
# helix.notification.smtp.password=
# helix.notification.smtp.starttls=true
# helix.notification.smtp.from-address=no-reply@helix.local
# helix.notification.smtp.from-name=HelixIAM
